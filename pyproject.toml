[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebbf"
version = "1.0.0"
description = "EBB&Flow: Empirical Bayes Bootstrapping and Flow Matching"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
keywords = [
    "diffusion model",
    "flow matching",
    "spatial transcriptomics",
    "transcript assignment",
    "cell segmentation",
]
authors = [{ name = "Christopher Tosh", email = "christopher.j.tosh@gmail.com" }]
maintainers = [
    { name = "Christopher Tosh", email = "christopher.j.tosh@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "tqdm",
    "scipy",
    "torch",
    "einops",
    "datasets",
    "pandas",
    "geopandas",
    "shapely",
    "polars",
    "omegaconf",
    "wandb",
    "pyarrow",
    "torchdiffeq",
    "scikit-learn",
    "scikit-image",
    "matplotlib",
    "rtree",
    "anndata",
]

[project.optional-dependencies]
dev = [
    "multiqc",
    "nf-core",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]

[project.scripts]
ebbf-preprocess = "ebbf.cli.preprocess:main"
ebbf-train = "ebbf.cli.train:main"
ebbf-infer = "ebbf.cli.infer:main"
ebbf-postprocess = "ebbf.cli.post_process:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N803",  # Argument name should be lowercase (common in ML: X for matrices)
    "N806",  # Variable name should be lowercase (common in ML: B, K, M for batch/dim)
    "N812",  # Lowercase imported as non-lowercase (common: torch.nn.functional as F)
    "N817",  # CamelCase imported as acronym (common: DistributedDataParallel as DDP)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "multiqc",
    "nf-core",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "ipython>=9.11.0",
    "vulture>=2.0",
    "cirro>=1.0.0",
    "boto3>=1.26.0",
    "requests>=2.28.0",
]
