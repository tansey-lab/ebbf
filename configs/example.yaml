experiment_name: coad
seed: 100

data:
  sampler: empirical-bayes
  tma_fname: /data1/tanseyw/projects/tosh/nuc_diffusion/data/spatch/coad/stdata.npz
  patch_size: 100
  patch_padding: 10
  max_tx: 32768 ## 16384
  dataset_size: 1e5
  min_nucs: 5
  min_tx_factor: 0.75
  max_tx_factor: 1.25
  oversample_tx_factor: 1.5
  max_nuc_dropout_prob: 0.2
  triangle_dirichlet_scale: 25.0
  max_cell_expansion_factor: 1.5
  max_noise_prob: 0.15
  max_noise_scale: 3.0

model:
  conditioned: nuc
  img_resolution: 128
  in_channels: 64
  model_channels: 128
  out_channels: 128
  num_blocks: 2
  attn_resolutions: [32, 16]
  dropout: 0.1
  channel_mult: [1, 2, 2, 4]
  channel_mult_emb: 4
  channels_per_head: 64
  nuc_channel_frac: 0.05
  splat: true

optim:
  optimizer: AdamW
  lr: 1e-4
  beta1: 0.9
  beta2: 0.999
  clip_grad: 10.0
  eps: 1e-8
  use_scaler: False

train:
  use_ema: true
  ema_warmup_epochs: 100
  save_freq: 1
  batch_size: 64
  n_epochs: 350
  grad_accum_steps: 2
  time_skew: 2.0 ## time will be drawn from Beta( time_skew, 1)
  wandb_enabled: true ## set to false to disable wandb metrics reporting

infer:
  tx_fname: null
  batch_size: 16
  model_checkpoint: null
  atol: 1e-5
  rtol: 1e-5
  device: auto # device for inference (auto, cuda, or cpu)
